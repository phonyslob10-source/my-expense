name: Check Cloudflare

on:
  push:
    paths:
      - "cloudflare_worker/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "pyproject.toml"
      - "frontend/**"
      - ".github/workflows/cloudflare-check.yml"
  pull_request:
    paths:
      - "cloudflare_worker/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "pyproject.toml"
      - "frontend/**"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Check Python syntax
        run: python -m py_compile cloudflare_worker/main.py

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Install Worker dependencies
        run: uv sync
