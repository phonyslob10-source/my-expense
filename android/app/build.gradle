plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phonyslob10.myexpense'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.phonyslob10.myexpense'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
        // The release workflow supplies the deployed Cloudflare HTTPS URL with
        // -PserverUrl. An invalid fallback prevents new APKs from silently
        // retaining the retired Tailscale-only endpoint.
        def configuredServerUrl = providers.gradleProperty('serverUrl')
            .getOrElse('https://my-expense.invalid')
        buildConfigField 'String', 'SERVER_URL', '"' + configuredServerUrl + '"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
